<body>
    <header>
        <div class="logo-container">
            <img src="images/CatoLeaf.jpg" alt="Argentum Back Up Energy Cat Logo" class="logo-img">
            <div class="site-title">
                <h2>ARGENTUM<br>BACK UP<br>ENERGY</h2>
            </div>
        </div>
        <button id="menuBtn" aria-label="Toggle Navigation">
            <img src="images/toggle.png" alt="menu toggle" class="toggle-icon">
        </button>
        <nav>
            <ul id="primaryNav">
                <li><a href="index.html">Home</a></li>
                <li><span class="separator">|</span></li>
                <li><a href="info.html">Info Center</a></li>
                <li><span class="separator">|</span></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><span class="separator">|</span></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="currency-banner">
            <p>Live Exchange Rate: 1 USD = <span id="ars-rate">Loading...</span> ARS</p>
        </div>

        <section class="filters">
            <button class="filter-btn active" data-filter="all">All Products</button>
            <button class="filter-btn" data-filter="battery">Battery Banks</button>
            <button class="filter-btn" data-filter="solar">Solar Panels</button>
            <button class="filter-btn" data-filter="awning">Awnings</button>
            <button class="filter-btn" data-filter="house">House</button>
            <button class="filter-btn" data-filter="apartment">Apartment</button>
            <button class="filter-btn" data-filter="car">Cars</button>
        </section>

        <section class="product-catalog">
            <div id="product-grid" class="grid-container"></div>
        </section>

        <dialog id="product-modal">
            <div class="modal-content">
                <button id="close-modal" class="close-btn">X</button>
                <img id="modal-img" src="" alt="">
                <h2 id="modal-title"></h2>
                <p id="modal-desc"></p>
                <p class="modal-price">Price: $<span id="modal-price"></span> USD</p>
            </div>
        </dialog>
    </main>

    <footer>
        <div class="footer-left">
            <img src="images/CatoLeaf.jpg" alt="Argentum Cat Logo" class="footer-logo">
            <div class="footer-title">
                <p>ARGENTUM BACK UP</p>
                <p>ENERGY</p>
            </div>
        </div>
        <div class="footer-center">
            <p id="lastModified"></p>
        </div>
        <div class="footer-right">
            <img src="images/instagram.png" alt="Instagram" class="social-icon">
            <span class="separator">|</span>
            <a href="#">linkedin</a>
            <span class="separator">|</span>
            <a href="#">tiktok</a>
            <span class="separator">|</span>
        </div>
    </footer>

    <script type="module" src="scripts/products.js"></script>
